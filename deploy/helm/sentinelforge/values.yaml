replicaCount: 1

image:
  repository: sentinelforge
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8420

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"
